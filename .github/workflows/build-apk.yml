name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history is needed to collect changes since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Each workflow run needs a higher version code so Android accepts the update.
      - name: Build release APK
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      # Keep a stable download filename and a versioned copy for release pages.
      - name: Add versioned copy of the APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Texter-v1.0.${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texter-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/Texter-v1.0.${{ github.run_number }}.apk

      - name: Get commit messages since last release
        id: commit_message
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          {
            echo 'message<<EOF'
            git log "$RANGE" --pretty='- %s'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # A new tag lets update checkers detect each release.
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: ${{ steps.commit_message.outputs.message }}
          artifacts: "app/build/outputs/apk/release/app-release.apk,app/build/outputs/apk/release/Texter-v1.0.${{ github.run_number }}.apk"
          prerelease: false
